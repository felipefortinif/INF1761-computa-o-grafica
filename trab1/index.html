<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Relógio Analógico - WebGPU</title>
  <style>
    body { margin: 0; background: #888; display: flex; justify-content: center; align-items: center; height: 100vh; }
    canvas { display: block; }
    #error { color: #ff6b6b; font-family: monospace; font-size: 18px; text-align: center; padding: 20px; }
  </style>
</head>
<body>
  <canvas id="canvas" width="600" height="600"></canvas>
  <div id="error" style="display:none"></div>
  <script type="module">
    async function main() {
      const canvas = document.getElementById('canvas');
      const errorDiv = document.getElementById('error');

      if (!navigator.gpu) {
        canvas.style.display = 'none';
        errorDiv.style.display = 'block';
        errorDiv.textContent = 'WebGPU não suportado neste navegador. Use Chrome 113+ ou Edge 113+.';
        return;
      }

      const adapter = await navigator.gpu.requestAdapter();
      if (!adapter) {
        canvas.style.display = 'none';
        errorDiv.style.display = 'block';
        errorDiv.textContent = 'Não foi possível obter um adaptador WebGPU.';
        return;
      }

      const device = await adapter.requestDevice();
      const context = canvas.getContext('webgpu');
      const format = navigator.gpu.getPreferredCanvasFormat();
      context.configure({ device, format, alphaMode: 'premultiplied' });

      // ── WGSL shader ──────────────────────────────────────────────────────────
      const shaderCode = /* wgsl */`
        struct Uniforms {
          resolution : vec2f,
        };

        @group(0) @binding(0) var<uniform> uni : Uniforms;

        struct VertIn {
          @location(0) pos   : vec2f,
          @location(1) color : vec4f,
        };

        struct VertOut {
          @builtin(position) position : vec4f,
          @location(0)       color    : vec4f,
        };

        @vertex
        fn vs_main(v : VertIn) -> VertOut {
          var out : VertOut;
          // Convert from pixel space to clip space
          let clip = (v.pos / uni.resolution) * 2.0 - vec2f(1.0, 1.0);
          out.position = vec4f(clip.x, -clip.y, 0.0, 1.0);
          out.color = v.color;
          return out;
        }

        @fragment
        fn fs_main(f : VertOut) -> @location(0) vec4f {
          return f.color;
        }
      `;

      const shaderModule = device.createShaderModule({ code: shaderCode });

      // Pipeline
      const pipeline = device.createRenderPipeline({
        layout: 'auto',
        vertex: {
          module: shaderModule,
          entryPoint: 'vs_main',
          buffers: [{
            arrayStride: 6 * 4, // 2 floats pos + 4 floats color
            attributes: [
              { shaderLocation: 0, offset: 0,      format: 'float32x2' },
              { shaderLocation: 1, offset: 2 * 4,  format: 'float32x4' },
            ],
          }],
        },
        fragment: {
          module: shaderModule,
          entryPoint: 'fs_main',
          targets: [{ format,
            blend: {
              color: { srcFactor: 'src-alpha', dstFactor: 'one-minus-src-alpha', operation: 'add' },
              alpha: { srcFactor: 'one',       dstFactor: 'one-minus-src-alpha', operation: 'add' },
            },
          }],
        },
        primitive: { topology: 'triangle-list' },
      });

      // Uniform buffer (resolution)
      const uniformBuffer = device.createBuffer({
        size: 8, // vec2f = 8 bytes
        usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST,
      });
      device.queue.writeBuffer(uniformBuffer, 0, new Float32Array([canvas.width, canvas.height]));

      const bindGroup = device.createBindGroup({
        layout: pipeline.getBindGroupLayout(0),
        entries: [{ binding: 0, resource: { buffer: uniformBuffer } }],
      });

      // ── Geometry helpers ─────────────────────────────────────────────────────
      const W = canvas.width;
      const H = canvas.height;
      const CX = W / 2;
      const CY = H / 2;
      const R  = Math.min(W, H) / 2 - 10; // clock radius

      // Produce triangles for a filled circle using a fan
      function circleTriangles(cx, cy, radius, segments, r, g, b, a) {
        const verts = [];
        for (let i = 0; i < segments; i++) {
          const a0 = (i / segments) * Math.PI * 2;
          const a1 = ((i + 1) / segments) * Math.PI * 2;
          // center
          verts.push(cx, cy, r, g, b, a);
          // p0
          verts.push(cx + Math.cos(a0) * radius, cy + Math.sin(a0) * radius, r, g, b, a);
          // p1
          verts.push(cx + Math.cos(a1) * radius, cy + Math.sin(a1) * radius, r, g, b, a);
        }
        return verts;
      }

      // Ring (annulus) for the border
      function ringTriangles(cx, cy, innerR, outerR, segments, r, g, b, a) {
        const verts = [];
        for (let i = 0; i < segments; i++) {
          const a0 = (i / segments) * Math.PI * 2;
          const a1 = ((i + 1) / segments) * Math.PI * 2;
          const ix0 = cx + Math.cos(a0) * innerR, iy0 = cy + Math.sin(a0) * innerR;
          const ix1 = cx + Math.cos(a1) * innerR, iy1 = cy + Math.sin(a1) * innerR;
          const ox0 = cx + Math.cos(a0) * outerR, oy0 = cy + Math.sin(a0) * outerR;
          const ox1 = cx + Math.cos(a1) * outerR, oy1 = cy + Math.sin(a1) * outerR;
          verts.push(ix0, iy0, r, g, b, a,  ox0, oy0, r, g, b, a,  ox1, oy1, r, g, b, a);
          verts.push(ix0, iy0, r, g, b, a,  ox1, oy1, r, g, b, a,  ix1, iy1, r, g, b, a);
        }
        return verts;
      }

      // Rotated rectangle (trapezoid-style hand) centered at base point
      // base: center of rotation (clock center), tip along angle
      function handQuad(cx, cy, angle, length, widthHalf, r, g, b, a) {
        // angle 0 = 12 o'clock = -PI/2 in standard math
        const rad = angle - Math.PI / 2;
        const cos = Math.cos(rad), sin = Math.sin(rad);
        const perp = [-sin, cos]; // perpendicular

        const tipX   = cx + cos * length;
        const tipY   = cy + sin * length;
        const base1X = cx + perp[0] *  widthHalf;
        const base1Y = cy + perp[1] *  widthHalf;
        const base2X = cx + perp[0] * -widthHalf;
        const base2Y = cy + perp[1] * -widthHalf;
        // Tail (small extension behind center)
        const tail   = length * 0.15;
        const tail1X = cx - cos * tail + perp[0] *  widthHalf * 0.6;
        const tail1Y = cy - sin * tail + perp[1] *  widthHalf * 0.6;
        const tail2X = cx - cos * tail + perp[0] * -widthHalf * 0.6;
        const tail2Y = cy - sin * tail + perp[1] * -widthHalf * 0.6;

        // Pentagon-like hand: tail1, tail2, base2, tip, base1
        return [
          base1X, base1Y, r, g, b, a,
          base2X, base2Y, r, g, b, a,
          tipX,   tipY,   r, g, b, a,

          tail1X, tail1Y, r, g, b, a,
          tail2X, tail2Y, r, g, b, a,
          base2X, base2Y, r, g, b, a,

          tail1X, tail1Y, r, g, b, a,
          base2X, base2Y, r, g, b, a,
          base1X, base1Y, r, g, b, a,
        ];
      }

      // Tick marks (rectangles as two triangles)
      function tickMarks() {
        const verts = [];
        for (let i = 0; i < 12; i++) {
          const angle = (i / 12) * Math.PI * 2 - Math.PI / 2;
          const outerR = R - 2;
          const innerR = R - 20;
          const halfW  = 4;
          const cos = Math.cos(angle), sin = Math.sin(angle);
          const perp = [-sin, cos];

          const ox1 = CX + cos * outerR + perp[0] *  halfW;
          const oy1 = CY + sin * outerR + perp[1] *  halfW;
          const ox2 = CX + cos * outerR + perp[0] * -halfW;
          const oy2 = CY + sin * outerR + perp[1] * -halfW;
          const ix1 = CX + cos * innerR + perp[0] *  halfW;
          const iy1 = CY + sin * innerR + perp[1] *  halfW;
          const ix2 = CX + cos * innerR + perp[0] * -halfW;
          const iy2 = CY + sin * innerR + perp[1] * -halfW;

          verts.push(ox1, oy1, 0, 0, 0, 1,  ox2, oy2, 0, 0, 0, 1,  ix2, iy2, 0, 0, 0, 1);
          verts.push(ox1, oy1, 0, 0, 0, 1,  ix2, iy2, 0, 0, 0, 1,  ix1, iy1, 0, 0, 0, 1);
        }
        return verts;
      }

      // ── Static geometry (face + ticks) ──────────────────────────────────────
      const SEGS = 64;
      const staticVerts = [
        // White face
        ...circleTriangles(CX, CY, R, SEGS, 1.0, 1.0, 1.0, 1.0),
        // Black border
        ...ringTriangles(CX, CY, R - 6, R, SEGS, 0, 0, 0, 1.0),
        // Tick marks
        ...tickMarks(),
      ];

      const staticBuffer = device.createBuffer({
        size: staticVerts.length * 4,
        usage: GPUBufferUsage.VERTEX | GPUBufferUsage.COPY_DST,
      });
      device.queue.writeBuffer(staticBuffer, 0, new Float32Array(staticVerts));
      const staticCount = staticVerts.length / 6;

      // ── Dynamic vertex buffer (hands + center cap) ───────────────────────────
      // We'll update every frame. Max vertices: generous estimate.
      const MAX_DYNAMIC = 3000;
      const dynamicBuffer = device.createBuffer({
        size: MAX_DYNAMIC * 6 * 4,
        usage: GPUBufferUsage.VERTEX | GPUBufferUsage.COPY_DST,
      });

      // ── Render loop ──────────────────────────────────────────────────────────
      function frame() {
        const now  = new Date();
        const hr   = now.getHours() % 12;
        const min  = now.getMinutes();
        const sec  = now.getSeconds();
        const ms   = now.getMilliseconds();

        // Smooth angles (in turns, 0 = 12 o'clock)
        const secAngle = ((sec + ms / 1000) / 60) * Math.PI * 2;
        const minAngle = ((min + (sec + ms / 1000) / 60) / 60) * Math.PI * 2;
        const hrAngle  = ((hr  + (min + sec / 60) / 60) / 12) * Math.PI * 2;

        const dynVerts = [
          // Hour hand — black, short and wide
          ...handQuad(CX, CY, hrAngle,  R * 0.50, 10,  0, 0, 0, 1.0),
          // Minute hand — black, longer
          ...handQuad(CX, CY, minAngle, R * 0.72, 6,   0, 0, 0, 1.0),
          // Second hand — red, thin
          ...handQuad(CX, CY, secAngle, R * 0.85, 2.5, 0.9, 0.1, 0.1, 1.0),
          // Center dot
          ...circleTriangles(CX, CY, 7, 16, 0, 0, 0, 1.0),
        ];

        device.queue.writeBuffer(dynamicBuffer, 0, new Float32Array(dynVerts));
        const dynCount = dynVerts.length / 6;

        const encoder    = device.createCommandEncoder();
        const textureView = context.getCurrentTexture().createView();
        const pass = encoder.beginRenderPass({
          colorAttachments: [{
            view: textureView,
            clearValue: { r: 0.53, g: 0.53, b: 0.53, a: 1 },
            loadOp: 'clear',
            storeOp: 'store',
          }],
        });

        pass.setPipeline(pipeline);
        pass.setBindGroup(0, bindGroup);

        pass.setVertexBuffer(0, staticBuffer);
        pass.draw(staticCount);

        pass.setVertexBuffer(0, dynamicBuffer);
        pass.draw(dynCount);

        pass.end();
        device.queue.submit([encoder.finish()]);

        requestAnimationFrame(frame);
      }

      requestAnimationFrame(frame);
    }

    main().catch(err => {
      document.getElementById('canvas').style.display = 'none';
      const div = document.getElementById('error');
      div.style.display = 'block';
      div.textContent = 'Erro: ' + err.message;
      console.error(err);
    });
  </script>
</body>
</html>
